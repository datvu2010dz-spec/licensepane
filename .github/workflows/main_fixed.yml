name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and unzip project
        shell: bash
        run: |
          set -e
          mkdir -p build_source

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1 || true)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Không tìm thấy file ZIP project trong repo."
            echo "Các file hiện có:"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d build_source

          PROJECT=$(find build_source -type d -name '*.xcodeproj' | head -n 1 || true)
          if [ -z "$PROJECT" ]; then
            echo "ERROR: ZIP không chứa .xcodeproj"
            find build_source -maxdepth 5 -print | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          PROJECT_NAME=$(basename "$PROJECT")
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT"

      - name: Import certificate and provisioning profile
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -e
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ] || [ -z "$PROVISION_PROFILE_BASE64" ]; then
            echo "ERROR: Thiếu GitHub Secrets: P12_BASE64, P12_PASSWORD hoặc PROVISION_PROFILE_BASE64"
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p ci "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p ci "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | /usr/libexec/PlistBuddy -c 'Print:Name' /dev/stdin)
          TEAM_ID=$(security cms -D -i "$PROFILE_PATH" | /usr/libexec/PlistBuddy -c 'Print:TeamIdentifier:0' /dev/stdin)
          BUNDLE_ID=$(security cms -D -i "$PROFILE_PATH" | /usr/libexec/PlistBuddy -c 'Print:Entitlements:application-identifier' /dev/stdin | sed "s/^[^.]*\.//")

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "Profile: $PROFILE_NAME"
          echo "Team: $TEAM_ID"
          echo "Bundle ID: $BUNDLE_ID"

      - name: Build archive
        shell: bash
        run: |
          set -e
          xcodebuild \
            -project "$PROJECT" \
            -scheme LicensePanelApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/LicensePanelApp.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Export IPA
        shell: bash
        run: |
          set -e
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LicensePanelApp.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LicensePanelApp-IPA
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
