BASE64
          base64 -D -i "$RUNNER_TEMP/project.b64" -o "$RUNNER_TEMP/project.zip"
          unzip -q "$RUNNER_TEMP/project.zip" -d "$RUNNER_TEMP/project"
          PROJECT="$RUNNER_TEMP/project/LicensePanelApp.xcodeproj"
          test -d "$PROJECT" || { echo "ERROR: Xcode project was not created"; exit 1; }
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Project ready: $PROJECT"

      - name: Check signing secrets
        shell: bash
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$P12_BASE64" || { echo "Missing secret: P12_BASE64"; exit 1; }
          test -n "$P12_PASSWORD" || { echo "Missing secret: P12_PASSWORD"; exit 1; }
          test -n "$PROVISION_PROFILE_BASE64" || { echo "Missing secret: PROVISION_PROFILE_BASE64"; exit 1; }
          echo "All signing secrets are present."

      - name: Import certificate and provisioning profile
        shell: bash
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/signing.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$P12_BASE64" | base64 -D -o "$CERT"
          echo "$PROVISION_PROFILE_BASE64" | base64 -D -o "$PROFILE"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN" || true
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"

          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print:Name' "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print:TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print:Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          BUNDLE_ID="${APP_ID#*.}"
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(.*\)".*/\1/p' | head -n 1)
          test -n "$SIGNING_IDENTITY" || { echo "No signing identity found in P12"; exit 1; }
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "Profile: $PROFILE_NAME"
          echo "Team: $TEAM_ID"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Certificate: $SIGNING_IDENTITY"

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild             -project "$PROJECT"             -scheme LicensePanelApp             -sdk iphoneos             -configuration Release             -archivePath "$RUNNER_TEMP/LicensePanelApp.xcarchive"             archive             CODE_SIGN_STYLE=Manual             CODE_SIGN_IDENTITY="$SIGNING_IDENTITY"             DEVELOPMENT_TEAM="$TEAM_ID"             PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"             PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Export IPA
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$SIGNING_IDENTITY</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive             -archivePath "$RUNNER_TEMP/LicensePanelApp.xcarchive"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"             -exportPath "$RUNNER_TEMP/export"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LicensePanelApp-IPA
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
