name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Xcode project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$(find . -type d -name '*.xcodeproj' -not -path './build/*' | head -n 1 || true)"
          if [ -z "$PROJECT" ]; then
            echo "Không tìm thấy .xcodeproj trong repository."
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Found: $PROJECT"

      - name: Import certificate and provisioning profile
        shell: bash
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${P12_BASE64:-}" ] || [ -z "${P12_PASSWORD:-}" ] || [ -z "${PROVISION_PROFILE_BASE64:-}" ]; then
            echo "THIẾU SECRETS. Cần: P12_BASE64, P12_PASSWORD, PROVISION_PROFILE_BASE64"
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "ci-keychain" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "ci-keychain" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print:Name' "$PROFILE_PLIST")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print:UUID' "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print:TeamIdentifier:0' "$PROFILE_PLIST")
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print:Entitlements:application-identifier' "$PROFILE_PLIST")
          BUNDLE_ID="${APP_ID#*.}"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/"/ {print $2; exit}')"
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "Không tìm thấy signing identity trong P12."
            exit 1
          fi

          {
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "TEAM_ID=$TEAM_ID"
            echo "BUNDLE_ID=$BUNDLE_ID"
            echo "SIGNING_IDENTITY=$SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"

          echo "Profile: $PROFILE_NAME"
          echo "Team: $TEAM_ID"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Signing identity: $SIGNING_IDENTITY"

      - name: Build archive
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.project.outputs.project }}"
          ARCHIVE_PATH="$RUNNER_TEMP/LicensePanelApp.xcarchive"

          xcodebuild \
            -project "$PROJECT" \
            -scheme LicensePanelApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=YES

      - name: Export IPA
        shell: bash
        run: |
          set -euo pipefail
          EXPORT_DIR="$RUNNER_TEMP/export"
          ARCHIVE_PATH="$RUNNER_TEMP/LicensePanelApp.xcarchive"
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"

          rm -rf "$EXPORT_DIR"
          mkdir -p "$EXPORT_DIR"

          cat > "$EXPORT_PLIST" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>ad-hoc</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>${TEAM_ID}</string>
          <key>provisioningProfiles</key><dict>
          <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
          </dict>
          </dict></plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -exportPath "$EXPORT_DIR"

          IPA="$(find "$EXPORT_DIR" -type f -name '*.ipa' | head -n 1 || true)"
          if [ -z "$IPA" ]; then
            echo "Không tạo được IPA."
            find "$EXPORT_DIR" -maxdepth 3 -type f -print
            exit 1
          fi
          echo "IPA created: $IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LicensePanelApp-IPA
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 7
